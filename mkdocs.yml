site_name:  Technical Writer Portfolio
site_description: Портфолио технического писателя

theme:
  name: material
  # logo: images/logo.svg

  font:
    text: Roboto
    code: Roboto Mono

  language: ru

  palette:
    # Светлая тема
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Переключить на тёмную тему
      primary: teal
      accent: teal

    # Тёмная тема
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Переключить на светлую тему
      primary: teal
      accent: teal

  features:
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    #- toc.integrate
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Главная: index.md
  - Инструкции:
      - Главная: instructions/index.md
      - Отложенное сообщение в Telegram: instructions/kosovff-instruction.md
      - Сценарий удаления заметки: instructions/delete-note-scenario.md
  - Спецификации: 
      - Swagger: api/swagger.md
      - Redoc: api/redoc.md    
  - Диаграммы: 
      - Главная: diagrams/index.md
      - Диаграмма последовательности: diagram.md
  - Обо мне: about/index.md
markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.details

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.superfences

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.snippets  

plugins:
  - search
  - tags:
      tags_allowed:
        - портфолио
        - manuals
        - rules
        - helps
  - glightbox
  - swagger-ui-tag
  - redoc-tag  
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/ 

extra.css:
  - stylesheets/extra.css     